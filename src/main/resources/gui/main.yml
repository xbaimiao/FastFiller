# 创世斧主菜单
title: '&a创世菜单'

# 字符排版, 一行 9 个字符, 有几行菜单就是几行
layout:
  - ' A B C D '

# 功能按钮对应的排版字符
identifier:
  # 打开容器菜单
  container: 'A'
  # 清空方块
  clear: 'B'
  # 清除水源
  water: 'C'
  # 填充方块
  fill: 'D'

# material 支持三种写法:
#   STONE              原版材质
#   head:<base64>      自定义头颅
#   ce:<命名空间:物品id> CraftEngine 物品, 例如 ce:jzy:menu_icon
# 使用 CraftEngine 物品时, name / lore / custom-model-data 留空即可保留 CE 物品自带的外观
items:
  A:
    material: STONE
    name: "&a&l容器操作"
    custom-model-data: 20004
    lore:
      - '&a◎&7 往此创世斧里放入方块'
      - '&a◎&7 取出创世斧里面的方块'
      - ''
      - '&a◎&e 点击打开'
  B:
    material: DIAMOND_PICKAXE
    name: "&a&l清空方块"
    lore:
      - '&a◎&7 选好点后 &6点击 &7此按钮'
      - '&a◎&7 将选点区域 &6清空'
      - '&a◎&7 箱子等容器方块不会被清理'
      - ''
      - '&a◎&6 点击 &7清空'
  C:
    material: BUCKET
    name: "&a&l清除水源"
    lore:
      - '&a◎&7 选好点后 &6点击 &7此按钮'
      - '&a◎&7 将选点区域的 &6水源清空'
      - ''
      - '&a◎&6 点击 &7清空'
  D:
    material: SAND
    name: "&a&l方块填充"
    lore:
      - '&a◎&7 选好点后 &6点击 &7此按钮'
      - '&a◎&7 将使用创世斧 &6容器里的方块 &7填充选点区域'
      - ''
      - '&a◎&6 点击 &7填充'
