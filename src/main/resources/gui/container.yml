# 创世斧容器菜单
title: '&a创世容器'

# 字符排版, 一行 9 个字符, 有几行菜单就是几行
layout:
  - 'CCACCCBCC'

# 功能按钮对应的排版字符
identifier:
  # 放入方块
  add: 'A'
  # 取出方块
  remove: 'B'

# material 支持三种写法:
#   STONE              原版材质
#   head:<base64>      自定义头颅
#   ce:<命名空间:物品id> CraftEngine 物品, 例如 ce:jzy:menu_icon
# 使用 CraftEngine 物品时, name / lore / custom-model-data 留空即可保留 CE 物品自带的外观
items:
  A:
    material: LEVER
    name: "&a&l添加物品"
    custom-model-data: 20002
    lore:
      - '&a◎&7 往此创世斧里放入方块'
      - '&a◎&7 物品可用于一键填充方块'
      - ''
      - '&a◎&e 手上拿着方块点击此按钮即可添加'
      - '&a◎&e Shift + 右击 可快速将背包同类方块放入'
  B:
    material: LEVER
    name: '&c&l取出物品'
    custom-model-data: 20003
    lore:
      - '&a◎&7 取出存放在创世斧里的方块'
      - '&a◎&7 取出后你可以重新放入'
      - ''
      - '&a◎&e 左击取出 16 个 右击取出 64 个'
      - '&a◎&e Shift + 右击 可取出一背包'
  C:
    material: PAPER
    name: ' '
    custom-model-data: 20004
    lore:
      - ''
